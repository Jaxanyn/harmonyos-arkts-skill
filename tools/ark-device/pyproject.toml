[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ark-device"
version = "0.1.2"
description = "Bounded HarmonyOS device operations for Ark agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ark-device = "ark_device.cli:main"
ark-project = "ark_device.project:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ark_device = ["*.cjs"]
